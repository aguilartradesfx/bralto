<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Estratégico · Centro de Distribución · American Outlet</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg: #ffffff; --surface: #f5f5f5; --black: #0a0a0a;
  --gray-700: #555; --gray-500: #888; --gray-400: #aaa; --gray-300: #ccc;
  --gray-200: #e5e5e5; --gray-50: #fafafa;
  --orange: #ff6b2b; --orange-soft: rgba(255,107,43,0.08);
  --teal: #2a9d8f; --teal-soft: rgba(42,157,143,0.08);
  --amber: #f59e0b; --amber-soft: rgba(245,158,11,0.1);
  --purple: #6a4c93; --purple-soft: rgba(106,76,147,0.1);
  --red: #e63946; --red-soft: rgba(230,57,70,0.08);
  --green: #16a34a; --green-soft: rgba(22,163,74,0.08);
  --border: rgba(0,0,0,0.06); --border-strong: rgba(0,0,0,0.1);
  --nav-h: 72px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--black); font-family: 'Sora', sans-serif; line-height: 1.6; overflow: hidden; }
#progress-wrap { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 3px; background: var(--gray-200); }
#progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--orange)); width: 0%; transition: width 0.4s ease; }
#slide-area { position: fixed; top: 3px; left: 0; right: 0; bottom: var(--nav-h); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.slide-content { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 24px 32px; }
@keyframes slideInRight { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInLeft  { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: translateX(0); } }
.anim-right { animation: slideInRight 0.32s ease forwards; }
.anim-left  { animation: slideInLeft  0.32s ease forwards; }
#bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; }
.nav-btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 100px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--black); font-family: 'Sora', sans-serif; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.18s ease; white-space: nowrap; }
.nav-btn:hover:not(:disabled) { border-color: var(--black); transform: translateY(-1px); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.primary { background: var(--black); color: #fff; border-color: var(--black); }
.nav-btn.primary:hover:not(:disabled) { background: var(--teal); border-color: var(--teal); }
#slide-counter { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--gray-500); text-align: center; flex: 1; }

/* INTRO */
.intro-wrap { max-width: 680px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
.intro-logo { width: 100px; margin-bottom: 28px; }
.intro-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 18px; border-radius: 100px; background: var(--teal-soft); border: 1px solid rgba(42,157,143,0.3); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); margin-bottom: 20px; }
.intro-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulse 2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.intro-h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 800; line-height: 1.1; margin-bottom: 16px; }
.intro-h1 .accent { color: var(--teal); }
.intro-sub { font-size: 0.95rem; color: var(--gray-700); max-width: 560px; font-weight: 300; line-height: 1.7; margin-bottom: 28px; }
.intro-context { background: var(--black); color: #fff; border-radius: 18px; padding: 28px; width: 100%; text-align: left; margin-bottom: 24px; }
.ctx-label { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin-bottom: 10px; }
.ctx-title { font-size: 1.1rem; font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
.ctx-sub { font-size: 0.85rem; color: #aaa; line-height: 1.6; font-weight: 300; }
.ctx-sub strong { color: #fff; font-weight: 500; }
.flow-grid { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin-top: 16px; }
.flow-cd-box { background: rgba(42,157,143,0.2); border: 1px solid rgba(42,157,143,0.4); border-radius: 10px; padding: 12px 16px; text-align: center; }
.flow-cd-icon { font-size: 1.4rem; margin-bottom: 4px; }
.flow-cd-name { font-size: 0.78rem; font-weight: 700; }
.flow-pdvs { display: flex; flex-direction: column; gap: 6px; }
.flow-pdv { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
.intro-stats { display: flex; gap: 0; margin-bottom: 24px; width: 100%; border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden; }
.stat-item { flex: 1; padding: 16px 8px; text-align: center; border-left: 1px solid var(--border-strong); }
.stat-item:first-child { border-left: none; }
.stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; color: var(--teal); line-height: 1; }
.stat-label { font-size: 0.62rem; color: var(--gray-500); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }

/* HOWTO */
.howto-wrap { max-width: 600px; width: 100%; }
.slide-label { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.slide-label::before { content: ''; width: 18px; height: 1px; background: var(--teal); }
.slide-title { font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 800; color: var(--black); margin-bottom: 24px; line-height: 1.2; }
.howto-card { background: var(--teal-soft); border: 1px solid rgba(42,157,143,0.25); border-radius: 16px; padding: 24px; display: flex; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
.howto-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
.howto-body h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
.howto-body p { font-size: 0.88rem; color: var(--gray-700); line-height: 1.7; font-weight: 300; }
.howto-body p strong { color: var(--black); font-weight: 600; }
.howto-steps { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.step { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: var(--gray-50); border-radius: 10px; border: 1px solid var(--border); }
.step-num { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; color: var(--teal); flex-shrink: 0; padding-top: 1px; min-width: 20px; }
.step-text { font-size: 0.86rem; color: var(--gray-700); line-height: 1.6; }

/* IDENTITY */
.identity-wrap { max-width: 560px; width: 100%; }
.field-label { font-size: 0.72rem; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; letter-spacing: 0.06em; display: block; }
.field { padding: 12px 14px; background: var(--gray-50); border: 1px solid var(--border-strong); border-radius: 10px; font-family: 'Sora', sans-serif; font-size: 0.88rem; color: var(--black); width: 100%; }
.field:focus { outline: none; border-color: var(--teal); background: #fff; }
.field::placeholder { color: var(--gray-400); font-weight: 300; }
.field-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

/* QUESTION */
.q-wrap { max-width: 660px; width: 100%; }
.q-head { margin-bottom: 22px; }
.q-num { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700; color: var(--teal); margin-bottom: 4px; }
.q-text { font-size: clamp(1rem, 3vw, 1.25rem); font-weight: 700; color: var(--black); line-height: 1.4; margin-bottom: 6px; }
.q-sub { font-size: 0.83rem; color: var(--gray-500); font-weight: 300; line-height: 1.6; }
.q-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.q-tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 100px; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; font-weight: 600; text-transform: uppercase; }
.q-tag.single   { background: var(--orange-soft); color: var(--orange); }
.q-tag.multi    { background: var(--purple-soft); color: var(--purple); }
.q-tag.text-in  { background: var(--teal-soft); color: var(--teal); }
.q-tag.pct      { background: var(--green-soft); color: var(--green); }
.q-tag.matrix   { background: var(--amber-soft); color: var(--amber); }
.q-tag.priority { background: var(--black); color: #fff; }
.q-tag.training { background: var(--red-soft); color: var(--red); }
.training-badge { display: flex; align-items: center; gap: 10px; background: #fff5f5; border: 1px solid rgba(230,57,70,0.25); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
.training-badge-icon { font-size: 1.2rem; }
.training-badge-text { font-size: 0.82rem; color: var(--red); font-weight: 600; line-height: 1.5; }

/* OPTIONS */
.opts-list { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--gray-50); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.15s ease; }
.opt:hover { background: #fff; border-color: var(--gray-300); }
.opt.selected { background: var(--teal-soft); border-color: var(--teal); }
.opt-marker { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; border: 2px solid var(--gray-300); transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; }
.opt-marker.radio { border-radius: 50%; }
.opt-marker.check { border-radius: 4px; }
.opt.selected .opt-marker { background: var(--teal); border-color: var(--teal); color: #fff; }
.opt-label { flex: 1; font-size: 0.88rem; color: var(--black); font-weight: 500; line-height: 1.5; }
.opt-sub { display: block; font-size: 0.74rem; color: var(--gray-500); font-weight: 400; margin-top: 2px; font-style: italic; }

/* TEXTAREA */
.q-textarea { width: 100%; padding: 14px 16px; background: var(--gray-50); border: 1px solid var(--border-strong); border-radius: 10px; font-family: 'Sora', sans-serif; font-size: 0.88rem; color: var(--black); resize: vertical; min-height: 100px; transition: border-color 0.15s ease; }
.q-textarea:focus { outline: none; border-color: var(--teal); background: #fff; }
.q-textarea::placeholder { color: var(--gray-400); font-weight: 300; }

/* PCT */
.pct-wrap { padding: 8px 0; }
.pct-display { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; }
.pct-num { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; color: var(--teal); line-height: 1; transition: color 0.3s; }
.pct-lbl { font-size: 0.78rem; color: var(--gray-500); letter-spacing: 0.1em; text-transform: uppercase; }
.pct-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: var(--surface); border-radius: 100px; outline: none; }
.pct-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: var(--teal); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(42,157,143,0.4); }
.pct-slider::-moz-range-thumb { width: 22px; height: 22px; background: var(--teal); border-radius: 50%; cursor: pointer; border: none; }
.pct-marks { display: flex; justify-content: space-between; margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--gray-400); }

/* MATRIX */
.matrix-wrap { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; }
.matrix-header { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; background: var(--gray-50); padding: 10px 14px; border-bottom: 1px solid var(--border-strong); }
.matrix-header div { font-size: 0.68rem; font-weight: 700; color: var(--gray-500); letter-spacing: 0.08em; text-transform: uppercase; }
.matrix-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border-bottom: 1px solid var(--border); }
.matrix-row:last-child { border-bottom: none; }
.matrix-cat { padding: 10px 14px; font-size: 0.82rem; font-weight: 600; color: var(--black); background: var(--gray-50); border-right: 1px solid var(--border); display: flex; align-items: center; }
.matrix-input { padding: 10px 12px; background: #fff; border: none; border-right: 1px solid var(--border); font-family: 'Sora', sans-serif; font-size: 0.82rem; color: var(--black); }
.matrix-input:last-child { border-right: none; }
.matrix-input:focus { outline: none; background: #fffef0; }
.matrix-input::placeholder { color: var(--gray-400); font-size: 0.76rem; }

/* DISTRIBUTION */
.dist-wrap { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; }
.dist-header { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 0; background: var(--gray-50); padding: 10px 14px; border-bottom: 1px solid var(--border-strong); }
.dist-header div { font-size: 0.68rem; font-weight: 700; color: var(--gray-500); letter-spacing: 0.08em; text-transform: uppercase; }
.dist-row { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 0; border-bottom: 1px solid var(--border); }
.dist-row:last-child { border-bottom: none; }
.dist-tag { padding: 10px 12px; font-size: 0.72rem; font-weight: 700; background: var(--gray-50); border-right: 1px solid var(--border); display: flex; align-items: center; white-space: nowrap; }
.dist-tag.t1 { color: var(--orange); }
.dist-tag.t2 { color: var(--red); }
.dist-tag.t3 { color: var(--teal); }
.dist-input { padding: 10px 10px; background: #fff; border: none; border-right: 1px solid var(--border); font-family: 'Sora', sans-serif; font-size: 0.8rem; color: var(--black); }
.dist-input:last-child { border-right: none; }
.dist-input:focus { outline: none; background: #fffef0; }
.dist-input::placeholder { color: var(--gray-400); font-size: 0.74rem; }

/* SUBMIT */
.submit-wrap { max-width: 540px; width: 100%; text-align: center; }
.submit-icon { font-size: 3rem; margin-bottom: 20px; }
.submit-title { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; color: var(--black); margin-bottom: 12px; line-height: 1.2; }
.submit-title .accent { color: var(--teal); }
.submit-sub { font-size: 0.92rem; color: var(--gray-700); max-width: 420px; margin: 0 auto 32px; line-height: 1.7; font-weight: 300; }
.summary-card { background: var(--gray-50); border: 1px solid var(--border-strong); border-radius: 14px; padding: 20px 24px; margin-bottom: 28px; text-align: left; }
.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.summary-row:last-child { border-bottom: none; }
.summary-key { font-size: 0.8rem; color: var(--gray-500); font-weight: 500; }
.summary-val { font-size: 0.85rem; color: var(--black); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.submit-btn { width: 100%; padding: 16px; border-radius: 14px; background: var(--black); color: #fff; font-family: 'Sora', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; letter-spacing: 0.04em; }
.submit-btn:hover:not(:disabled) { background: var(--teal); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(42,157,143,0.3); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.reset-link { font-size: 0.8rem; color: var(--gray-400); cursor: pointer; margin-top: 16px; display: inline-block; text-decoration: underline; }
.success-wrap { max-width: 480px; width: 100%; text-align: center; }
.success-icon { font-size: 4rem; margin-bottom: 16px; }
.success-title { font-size: 1.8rem; font-weight: 800; color: var(--black); margin-bottom: 10px; }
.success-sub { font-size: 0.92rem; color: var(--gray-700); line-height: 1.7; font-weight: 300; }
.success-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 100px; background: var(--green-soft); color: var(--green); font-weight: 600; font-size: 0.82rem; margin-top: 24px; }

@media (max-width: 600px) {
  .field-group { grid-template-columns: 1fr; }
  .matrix-header, .dist-header { display: none; }
  .matrix-row, .dist-row { grid-template-columns: 1fr; }
  .matrix-cat, .dist-tag { border-right: none; border-bottom: 1px solid var(--border); }
  .matrix-input, .dist-input { border-right: none; border-bottom: 1px solid var(--border); }
  .flow-grid { grid-template-columns: 1fr; }
  .slide-content { padding: 28px 18px 24px; }
}
</style>
</head>
<body>
<div id="progress-wrap"><div id="progress-fill"></div></div>
<div id="slide-area"><div class="slide-content" id="slide-content"></div></div>
<div id="bottom-nav">
  <button class="nav-btn" id="btn-prev" onclick="prev()">← Anterior</button>
  <span id="slide-counter">1 / 29</span>
  <button class="nav-btn primary" id="btn-next" onclick="next()">Siguiente →</button>
</div>

<script>
/* ======== DATA ======== */
const questions = [
  // INVENTARIO (7)
  {id:'q01',block:'inventario',priority:true,type:'single',text:'¿Cuál es el valor TOTAL aproximado de la mercadería que actualmente tienen en el CD?',options:[

    {label:'₡50 – ₡100 millones',sub:'Inventario medio-alto'},{label:'₡100 – ₡200 millones',sub:'Inventario grande'},
    {label:'Más de ₡200 millones',sub:'Inventario premium'},{label:'No tengo el dato exacto — pendiente'}
  ]},
  {id:'q02',block:'inventario',priority:true,type:'single',text:'¿Cuánto del valor total se va a las 3 tiendas mensualmente en promedio?',options:[

    {label:'Accesorios (gorras, mochilas, carteras)'},{label:'Electrodomésticos / línea blanca'},

    {label:'Tecnología y electrónica'},{label:'Otros — especificar'}
  ]},
  {id:'q04',block:'inventario',priority:true,type:'matrix',text:'Por categoría: ¿cuánto valor (₡) representa y qué tan rápido rota?',
    sub:'Valor estimado en colones y rotación promedio en meses (1 mes = vuela rápido, 6+ meses = atorado).'},
  {id:'q05',block:'inventario',priority:true,type:'text',text:'¿Qué productos específicos se han agotado más rápido en los últimos 3 meses?',

  {id:'q07',block:'inventario',type:'multi',text:'¿De dónde vienen las importaciones? (esto define la narrativa del producto en redes)',options:[

    {label:'Sudamérica (Colombia, Brasil)'},{label:'Producto nacional / Costa Rica'},
    {label:'Mezcla — varía por categoría'}
  ]},
  // CLASIFICACIÓN (6)
  {id:'q08',block:'clasificacion',priority:true,type:'multi',text:'🟢 ROTACIÓN RÁPIDA · ¿Qué productos vuelan en menos de 30 días?',options:[
    {label:'Ropa básica de hombre/mujer'},{label:'Calzado deportivo de marca conocida'},
    {label:'Productos de hogar de uso frecuente'},{label:'Accesorios económicos (gorras, mochilas)'},

function buildQuestion(qIdx) {
  const q = questions[qIdx];

  let typeTag = '';
  if (q.type === 'single') typeTag = '<span class="q-tag single">○ Selección única</span>';
  else if (q.type === 'multi') typeTag = '<span class="q-tag multi">☑ Selección múltiple</span>';
  else if (q.type === 'text') typeTag = '<span class="q-tag text-in">✎ Respuesta abierta</span>';
  else if (q.type === 'pct') typeTag = '<span class="q-tag pct">% Porcentaje</span>';
  else if (q.type === 'matrix') typeTag = '<span class="q-tag matrix">⊞ Matriz por categoría</span>';
  else if (q.type === 'distribution') typeTag = '<span class="q-tag matrix">⊞ Distribución 3 PDV</span>';
  const priorityTag = q.priority ? '<span class="q-tag priority">★ Crítica</span>' : '';
  const trainingTag = isCapacitacion ? '<span class="q-tag training">🎓 Capacitación</span>' : '';

  let inputHtml = '';
  if (q.type === 'single' || q.type === 'multi') {
    const selected = answers[q.id] || [];
    const marker = q.type === 'single' ? 'radio' : 'check';
    const chk = q.type === 'single' ? '●' : '✓';
    inputHtml = `<div class="opts-list">${q.options.map((opt,i)=>`
      <div class="opt ${selected.includes(i)?'selected':''}" onclick="handleOpt('${q.id}',${i},'${q.type}')">
        <div class="opt-marker ${marker}">${selected.includes(i)?chk:''}</div>
        <div class="opt-label">${opt.label}${opt.sub?`<span class="opt-sub">${opt.sub}</span>`:''}</div>
      </div>`).join('')}</div>`;
  } else if (q.type === 'text') {
    inputHtml = `<textarea class="q-textarea" placeholder="${q.placeholder}" oninput="handleText('${q.id}',this.value)">${answers[q.id]||''}</textarea>`;
  } else if (q.type === 'pct') {
    const val = answers[q.id] !== undefined ? answers[q.id] : 50;
    inputHtml = `<div class="pct-wrap">
      <div class="pct-display"><div class="pct-num" id="pn-${q.id}">${val}</div><div class="pct-lbl">% / nivel</div></div>
      <input type="range" min="0" max="100" value="${val}" class="pct-slider" oninput="handlePct('${q.id}',this.value)">
      <div class="pct-marks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    </div>`;
  } else if (q.type === 'matrix') {
    const mx = answers[q.id] || {};
    inputHtml = `<div class="matrix-wrap">
      <div class="matrix-header"><div>Categoría</div><div>Valor estimado (₡)</div><div>Rotación (meses)</div></div>
      ${MATRIX_CATS.map((cat,ci)=>`
      <div class="matrix-row">
        <div class="matrix-cat">${cat}</div>
        <input type="text" class="matrix-input" placeholder="Ej: ₡15M" value="${mx[ci+'_valor']||''}" oninput="handleMatrix('${q.id}','${ci}_valor',this.value)">
        <input type="text" class="matrix-input" placeholder="Ej: 2 meses" value="${mx[ci+'_rot']||''}" oninput="handleMatrix('${q.id}','${ci}_rot',this.value)">
      </div>`).join('')}
    </div>`;
  } else if (q.type === 'distribution') {
    const dist = answers[q.id] || {};
    inputHtml = `<div class="dist-wrap">
      <div class="dist-header"><div>PDV</div><div>Valor mensual (₡)</div><div>% del total</div><div># envíos</div></div>
      ${[{key:'florencia',cls:'t1',name:'AO Florencia'},{key:'fortuna',cls:'t2',name:'AO Fortuna'},{key:'quesada',cls:'t3',name:'AO C. Quesada'}].map(p=>`
      <div class="dist-row">
        <div class="dist-tag ${p.cls}">${p.name}</div>
        <input type="text" class="dist-input" placeholder="Ej: ₡8M" value="${dist[p.key+'_valor']||''}" oninput="handleDist('${q.id}','${p.key}_valor',this.value)">
        <input type="text" class="dist-input" placeholder="Ej: 35%" value="${dist[p.key+'_pct']||''}" oninput="handleDist('${q.id}','${p.key}_pct',this.value)">
        <input type="text" class="dist-input" placeholder="Ej: 2-3x" value="${dist[p.key+'_envios']||''}" oninput="handleDist('${q.id}','${p.key}_envios',this.value)">
      </div>`).join('')}
    </div>`;
  }

  return `<div class="q-wrap">
    ${isCapacitacion && num === 23 ? `<div class="training-badge"><div class="training-badge-icon">🎓</div><div class="training-badge-text">Las siguientes 3 preguntas son sobre la capacitación en la plataforma all-in-one de Bralto</div></div>` : ''}

      <div class="q-tags">${typeTag}${priorityTag}${trainingTag}</div>
    </div>
    ${inputHtml}
  </div>`;
}

/* ======== HANDLERS ======== */
function handleOpt(id, idx, type) {
  if (type === 'single') {
    answers[id] = [idx];
    document.querySelectorAll(`.opt[onclick^="handleOpt('${id}'"]`).forEach((el,i) => {
      el.classList.toggle('selected', i === idx);
      el.querySelector('.opt-marker').textContent = i === idx ? '●' : '';
    });
  } else {
    if (!answers[id]) answers[id] = [];
    const i = answers[id].indexOf(idx);
    const el = document.querySelectorAll(`.opt[onclick^="handleOpt('${id}'"]`)[idx];
    if (i > -1) { answers[id].splice(i,1); if(el){el.classList.remove('selected');el.querySelector('.opt-marker').textContent='';} }
    else { answers[id].push(idx); if(el){el.classList.add('selected');el.querySelector('.opt-marker').textContent='✓';} }
    if (!answers[id].length) delete answers[id];
  }
  clearError();
  updateProgress();
}
function handleText(id, val) { if(val.trim()) answers[id]=val; else delete answers[id]; clearError(); updateProgress(); }
function handlePct(id, val) {
  answers[id] = parseInt(val);
  const el = document.getElementById('pn-'+id);
  if(el){el.textContent=val;const v=parseInt(val);el.style.color=v>=75?'#16a34a':v>=50?'#2a9d8f':v>=25?'#fbbf24':'#aaa';}
  updateProgress();
}
function handleMatrix(id, key, val) {
  if(!answers[id]) answers[id]={};
  if(val.trim()) answers[id][key]=val; else delete answers[id][key];
  if(!Object.keys(answers[id]).length) delete answers[id];
  clearError();
  updateProgress();
}
function handleDist(id, key, val) {
  if(!answers[id]) answers[id]={};
  if(val.trim()) answers[id][key]=val; else delete answers[id][key];
  if(!Object.keys(answers[id]).length) delete answers[id];
  clearError();
  updateProgress();
}

/* ======== NAV ======== */
function goTo(index, dir) {
  if(index<0||index>=TOTAL_SLIDES) return;
  animDir=dir; cur=index; render(); updateNav(); updateProgress();
  document.getElementById('slide-area').scrollTop=0;
}

function validateCurrent() {
  if (cur === 2) {
    if (!meta.encargado.trim()) return 'Ingresá el nombre del encargado.';
    if (!meta.contact.trim()) return 'Ingresá el WhatsApp o teléfono de contacto.';
    if (!meta.email.trim()) return 'Ingresá el correo electrónico.';
    if (!meta.ubicacion.trim()) return 'Ingresá la ubicación del CD.';
    if (!meta.mes.trim()) return 'Ingresá el mes reportado.';
  }
  const qIdx = cur - 3;
  if (qIdx >= 0 && qIdx < questions.length) {
    const q = questions[qIdx];
    if (q.type !== 'pct' && !answers[q.id]) return 'Esta pregunta es obligatoria. Seleccioná o completá una respuesta.';
  }
  return null;
}

function showError(msg) {
  let el = document.getElementById('val-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'val-error';
    el.style.cssText = 'position:fixed;bottom:var(--nav-h);left:0;right:0;background:#e63946;color:#fff;text-align:center;padding:10px 16px;font-size:0.82rem;font-weight:600;z-index:300;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
}

function clearError() {
  const el = document.getElementById('val-error');
  if (el) el.style.display = 'none';
}

function next(){
  const err = validateCurrent();
  if (err) { showError(err); return; }
  clearError();
  goTo(cur+1,'right');
}
function prev(){clearError();goTo(cur-1,'left');}
function render(){
  const area=document.getElementById('slide-content');
  area.innerHTML=buildSlide(cur);
  area.className='slide-content '+(animDir==='right'?'anim-right':'anim-left');
}
function updateNav(){
  document.getElementById('btn-prev').disabled=cur===0;
  const nb=document.getElementById('btn-next');
  nb.disabled=cur===TOTAL_SLIDES-1;
  nb.textContent=cur===TOTAL_SLIDES-2?'Ver resumen →':'Siguiente →';
  document.getElementById('slide-counter').textContent=`${cur+1} / ${TOTAL_SLIDES}`;
}
function updateProgress(){
  document.getElementById('progress-fill').style.width=((cur+1)/TOTAL_SLIDES*100)+'%';
}

/* ======== PDF + SUBMIT ======== */
function buildPdfHtml() {
  const date=new Date().toLocaleDateString('es-CR',{day:'2-digit',month:'long',year:'numeric'});
  const blocksOrder=['inventario','clasificacion','distribucion','operacion','capacitacion'];
  const blockColors={inventario:'#ff6b2b',clasificacion:'#f59e0b',distribucion:'#2a9d8f',operacion:'#6a4c93',capacitacion:'#e63946'};
  const blockNames={inventario:'Inventario',clasificacion:'Clasificación por tipo',distribucion:'Distribución por PDV',operacion:'Operación del CD',capacitacion:'Capacitación plataforma'};

  function ansHtml(q){
    const ans=answers[q.id];
    if(ans===undefined) return '<div style="color:#aaa;font-style:italic;font-size:0.85rem;">Sin responder</div>';
    if(q.type==='single'||q.type==='multi') return ans.map(i=>`<div style="padding:7px 12px;background:#f0fdf9;border-left:3px solid #2a9d8f;border-radius:4px;font-size:0.88rem;margin-bottom:4px;"><strong>${q.options[i].label}</strong>${q.options[i].sub?`<div style="color:#888;font-size:0.78rem;font-style:italic;">${q.options[i].sub}</div>`:''}</div>`).join('');
    if(q.type==='text') return `<div style="padding:10px 12px;background:#f0fdf9;border-left:3px solid #2a9d8f;border-radius:4px;font-size:0.88rem;white-space:pre-wrap;">${ans}</div>`;
    if(q.type==='pct'){const col=ans>=75?'#16a34a':ans>=50?'#2a9d8f':ans>=25?'#fbbf24':'#aaa';const lbl=ans>=75?'Muy alto':ans>=50?'Alto':ans>=25?'Medio':'Bajo';return `<div style="padding:10px 12px;background:#f0fdf9;border-left:3px solid ${col};border-radius:4px;"><strong style="font-size:1.4rem;color:${col};font-family:monospace;">${ans}%</strong> · ${lbl}</div>`;}
    if(q.type==='matrix'){const mx=ans||{};return `<table style="width:100%;border-collapse:collapse;font-size:0.82rem;"><tr style="background:#f5f5f5;"><th style="padding:6px 8px;text-align:left;">Categoría</th><th style="padding:6px 8px;text-align:left;">Valor (₡)</th><th style="padding:6px 8px;text-align:left;">Rotación</th></tr>${MATRIX_CATS.map((cat,ci)=>`<tr style="border-bottom:1px solid #eee;"><td style="padding:6px 8px;">${cat}</td><td style="padding:6px 8px;">${mx[ci+'_valor']||'—'}</td><td style="padding:6px 8px;">${mx[ci+'_rot']||'—'}</td></tr>`).join('')}</table>`;}
    if(q.type==='distribution'){const dist=ans||{};return `<table style="width:100%;border-collapse:collapse;font-size:0.82rem;"><tr style="background:#f5f5f5;"><th style="padding:6px 8px;text-align:left;">PDV</th><th style="padding:6px 8px;">Valor</th><th style="padding:6px 8px;">%</th><th style="padding:6px 8px;"># Envíos</th></tr>${[{key:'florencia',name:'AO Florencia'},{key:'fortuna',name:'AO Fortuna'},{key:'quesada',name:'AO C. Quesada'}].map(p=>`<tr style="border-bottom:1px solid #eee;"><td style="padding:6px 8px;font-weight:600;">${p.name}</td><td style="padding:6px 8px;">${dist[p.key+'_valor']||'—'}</td><td style="padding:6px 8px;">${dist[p.key+'_pct']||'—'}</td><td style="padding:6px 8px;">${dist[p.key+'_envios']||'—'}</td></tr>`).join('')}</table>`;}
    return '';
  }

  const blocksHtml=blocksOrder.map(bk=>{
    const bqs=questions.filter(q=>q.block===bk);
    if(!bqs.length) return '';
    return `<div style="margin-bottom:28px;">
      <div style="border-left:4px solid ${blockColors[bk]};padding:8px 14px;margin-bottom:14px;background:#fafafa;">
        <div style="font-size:1.1rem;font-weight:700;">${blockNames[bk]}</div>
      </div>
      ${bqs.map(q=>{
        const qNum=questions.indexOf(q)+1;
        return `<div style="margin-bottom:14px;padding:14px 16px;border:1px solid #eee;border-radius:10px;">
          <div style="font-family:monospace;font-size:0.72rem;font-weight:700;color:#2a9d8f;margin-bottom:5px;">${String(qNum).padStart(2,'0')}</div>
          <div style="font-size:0.92rem;font-weight:600;margin-bottom:8px;">${q.text}</div>
          ${ansHtml(q)}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  return `<div style="font-family:'Sora','Helvetica Neue',Arial,sans-serif;color:#0a0a0a;background:#fff;padding:40px;max-width:800px;margin:0 auto;">
    <div style="text-align:center;padding:50px 0 60px;border-bottom:3px solid #2a9d8f;margin-bottom:36px;">
      <img src="https://assets.cdn.filesafe.space/hdVpvshZP3RGJQbxx8GA/media/69c038d25596d1b810fd385d.png" alt="Bralto" style="width:100px;margin-bottom:24px;">
      <div style="font-family:monospace;font-size:0.65rem;letter-spacing:0.16em;text-transform:uppercase;color:#2a9d8f;margin-bottom:14px;">Discovery estratégico · Centro de Distribución</div>
      <h1 style="font-size:2rem;font-weight:800;margin-bottom:10px;">American Outlet<br><span style="color:#2a9d8f;">Centro de Distribución</span></h1>
      <div style="background:#fafafa;border-radius:10px;padding:14px 20px;max-width:400px;margin:18px auto;text-align:left;">
        <div style="font-size:0.88rem;margin-bottom:5px;"><strong>Encargado:</strong> ${meta.encargado||'—'}</div>
        <div style="font-size:0.88rem;margin-bottom:5px;"><strong>Contacto:</strong> ${meta.contact||'—'}</div>
        <div style="font-size:0.88rem;margin-bottom:5px;"><strong>Email:</strong> ${meta.email||'—'}</div>
        <div style="font-size:0.88rem;margin-bottom:5px;"><strong>Ubicación CD:</strong> ${meta.ubicacion||'—'}</div>
        <div style="font-size:0.88rem;"><strong>Mes reportado:</strong> ${meta.mes||'—'}</div>
      </div>
      <div style="font-family:monospace;font-size:0.68rem;color:#888;margin-top:16px;">${date} · Bralto · bralto.io</div>
    </div>
    <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:20px;">Discovery: 25 preguntas del CD</h2>
    ${blocksHtml}
    <div style="text-align:center;padding-top:28px;border-top:1px solid #eee;">
      <img src="https://assets.cdn.filesafe.space/hdVpvshZP3RGJQbxx8GA/media/69c038d25596d1b810fd385d.png" alt="Bralto" style="width:70px;opacity:0.5;">
      <p style="font-size:0.75rem;color:#aaa;margin-top:8px;">Bralto · bralto.io · Centro de Distribución</p>
    </div>
  </div>`;
}

async function submitForm() {
  const btn=document.getElementById('submit-btn');
  const spinner=document.getElementById('submit-spinner');
  const label=document.getElementById('submit-label');
  btn.disabled=true; spinner.style.display='block'; label.textContent='Generando PDF...';
  try {
    const pdfNode=document.createElement('div');
    pdfNode.innerHTML=buildPdfHtml();
    pdfNode.style.cssText='position:absolute;left:-9999px;top:0;width:800px;';
    document.body.appendChild(pdfNode);
    const filename=`Discovery_CD_${meta.encargado.replace(/\s+/g,'_')||'Encargado'}_${meta.mes.replace(/\s+/g,'_')||'Mes'}.pdf`;
    const pdfBlob=await html2pdf().set({
      margin:[10,10,10,10],filename,
      image:{type:'jpeg',quality:0.96},
      html2canvas:{scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['avoid-all','css','legacy']}
    }).from(pdfNode.firstElementChild).outputPdf('blob');
    document.body.removeChild(pdfNode);
    label.textContent='Enviando...';
    const reader=new FileReader();
    const pdfBase64=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(pdfBlob);});
    const answered=Object.keys(answers).length+(meta.encargado?1:0);
    const res=await fetch('/api/discovery/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'cd',pdfBase64,pdfFilename:filename,metadata:{encargado:meta.encargado,contact:meta.contact,email:meta.email,ubicacion:meta.ubicacion,mes:meta.mes},answeredCount:answered,totalCount:questions.length+1})});
    if(!res.ok) throw new Error('Error del servidor');
    document.getElementById('slide-content').innerHTML=`<div class="success-wrap"><div class="success-icon">✅</div><h2 class="success-title">¡Discovery enviado!</h2><p class="success-sub">Bralto recibió el discovery del CD con el PDF adjunto. Esta información se cruza con las respuestas de cada administrador de PDV para construir el calendario mensual.</p><div class="success-badge">✓ Correo enviado correctamente</div></div>`;
    document.getElementById('bottom-nav').style.display='none';
    document.getElementById('progress-fill').style.width='100%';
  } catch(err) {
    console.error(err);
    btn.disabled=false; spinner.style.display='none'; label.textContent='Enviar discovery →';
    alert('Hubo un problema al enviar. Verificá tu conexión y volvé a intentar.');
  }
}

function resetAll(){if(!confirm('¿Seguro que querés borrar todas las respuestas?')) return;Object.keys(answers).forEach(k=>delete answers[k]);meta.encargado='';meta.contact='';meta.email='';meta.ubicacion='';meta.mes='';goTo(0,'left');}

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')next();if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();});
goTo(0,'right');
</script>
